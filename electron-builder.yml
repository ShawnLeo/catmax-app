appId: com.catmax.app
productName: Catmax
copyright: Copyright © 2026 shawn
directories:
  output: dist
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!tests/*'
  - '!*.md'
  - '!electron.vite.config.*'
  - '!{.eslintcache,.eslintrc.cjs,.prettierrc,.editorconfig}'
  - '!{.DS_Store,.git,.gitignore,.idea,.vscode}'
asarUnpack:
  - resources/**
  - '**/*.{node,dll}'
  # Agent SDK 的平台 binary（243MB claude 可执行文件）必须 unpack 到真实磁盘路径，
  # 否则 child_process.spawn 无法从 ASAR 虚拟 FS 执行二进制。
  # adapter.ts 的 resolveSdkBinaryPath() 会在 packaged 模式下通过
  # pathToClaudeCodeExecutable 指向这个 unpacked 路径。
  # 详见 docs/Agent SDK Electron 打包 PoC 验证报告.md
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-*/claude'

# macOS
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 不打 notarize（自用项目，省 Apple Developer 账号）

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      'y': 220
      type: link
      path: /Applications

# Windows
win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

extraMetadata:
  main: ./out/main/index.js
